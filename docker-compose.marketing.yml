# Marketing + demo overlay for Domi Ops public launch (WHO-183 / WHO-190).
#
# Usage — pick the base stack matching your deployment:
#   Self-host (single-tenant, DB in this compose):
#     docker compose -f docker-compose.prod.yml -f docker-compose.marketing.yml up -d --build
#   Hosted Starter (split infra — DO Managed Postgres + Spaces, see deploy/HOSTED_BETA_SETUP.md):
#     docker compose -f docker-compose.hosted-prod.yml -f docker-compose.marketing.yml up -d --build
#
# Demo profile (separate web container + nightly reset cron on host) — self-host base only:
#   docker compose -f docker-compose.prod.yml -f docker-compose.marketing.yml \
#     --profile demo up -d --build

services:
  www:
    container_name: domiops-www
    image: ghcr.io/mwhobrey/domi-ops-www:${DOMI_OPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/www/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.domi-ops.com}
      NEXT_PUBLIC_DEMO_URL: ${NEXT_PUBLIC_DEMO_URL:-https://demo.domi-ops.com}
      # "true" once the repo + GHCR images are public (WHO-174, done 2026-08-30) — self-host
      # links render "Coming soon" otherwise. Defaults false here since a self-hoster running
      # their own copy of apps/www hasn't necessarily forked/published their own repo.
      NEXT_PUBLIC_OSS_REPO_PUBLIC: ${NEXT_PUBLIC_OSS_REPO_PUBLIC:-false}
      # Flip to "true" once Stripe live keys + the hosted instance are both up
      # (deploy/HOSTED_BETA_SETUP.md) — pricing page CTA creates a real Checkout Session
      # via POST {NEXT_PUBLIC_APP_URL}/api/billing/checkout until then it shows "Coming soon".
      NEXT_PUBLIC_HOSTED_CHECKOUT_ENABLED: ${NEXT_PUBLIC_HOSTED_CHECKOUT_ENABLED:-false}
    networks:
      - proxy

  web:
    container_name: domiops-web
    environment:
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.domi-ops.com}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      DEMO_MODE: "false"

  demo-web:
    container_name: domiops-demo-web
    profiles:
      - demo
    image: ghcr.io/mwhobrey/domi-ops-web:${DOMI_OPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      PUBLIC_APP_URL: ${DEMO_PUBLIC_APP_URL:-https://demo.domi-ops.com}
      ALLOW_PUBLIC_SIGNUP: "false"
      DEMO_MODE: "true"
      DEMO_HOUSEHOLD_SLUG: ${DEMO_HOUSEHOLD_SLUG:-rivera-demo}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
    depends_on:
      api:
        condition: service_started
    networks:
      - proxy
