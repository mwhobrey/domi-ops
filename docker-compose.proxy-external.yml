# Attach Domi Ops web/api to an existing Docker network (e.g. HomeHub + Caddy).
# Caddy must share this network to reverse_proxy web:3000.
#
#   PROXY_NETWORK=headscale_default docker compose \
#     -f docker-compose.prod.yml \
#     -f docker-compose.proxy-external.yml up -d --build
#
# Confirm network name: docker network ls
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to your Caddy/HomeHub network name}

services:
  minio:
    networks:
      - proxy
