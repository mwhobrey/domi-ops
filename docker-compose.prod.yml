# Production on DigitalOcean (or any VPS).
# Point Caddy at web:3000 — see deploy/Caddyfile.example
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whome}
    volumes:
      - whome_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whome}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whome_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - whome_redis:/data
    networks:
      - whome_internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - whome_minio:/data
    networks:
      - whome_internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-whome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whome}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - whome_internal
      - proxy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-whome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whome}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - whome_internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      - api
    networks:
      - proxy

networks:
  whome_internal:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  whome_pg:
  whome_redis:
  whome_minio:
