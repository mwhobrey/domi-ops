# Production — full stack in one compose file (no external Postgres/Redis/MinIO).
#
# Services: postgres, redis, minio, api, worker, web (+ import profile "tools")
# Migrations run on API container start. S3 bucket created on first API boot.
#
# Recommended: pull pre-built GHCR images (ghcr.io/mwhobrey/domi-ops-*, public — no login
# required) instead of building on-box. This is the fast path — no repo clone of the full
# monorepo needed beyond this compose file + .env.
#
#   cp .env.example .env   # set secrets + PUBLIC_APP_URL
#   export DOMI_OPS_IMAGE_TAG=latest   # or a version tag / git sha — see docs/RELEASE_PROCESS.md
#   docker compose -f docker-compose.prod.yml pull api worker web
#   docker compose -f docker-compose.prod.yml up -d --no-build
#
# Building from source instead (contributors, or a fork with local changes):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reverse proxy: join Caddy on a shared Docker network (see docker-compose.proxy-external.yml).
# Staging rehearsal: add docker-compose.staging.yml (separate Postgres volume, :3002).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domi_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-domi_ops}
    volumes:
      - domi_ops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domi_ops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - domi_ops_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - domi_ops_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - domi_ops_internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - domi_ops_minio:/data
    networks:
      - domi_ops_internal

  api:
    image: ghcr.io/mwhobrey/domi-ops-api:${DOMI_OPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-domi_ops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-domi_ops}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - domi_ops_internal
      - proxy

  worker:
    image: ghcr.io/mwhobrey/domi-ops-worker:${DOMI_OPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-domi_ops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-domi_ops}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - domi_ops_internal

  web:
    container_name: domi-ops-web
    image: ghcr.io/mwhobrey/domi-ops-web:${DOMI_OPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_started
    networks:
      - proxy

  import:
    image: ghcr.io/mwhobrey/domi-ops-import:${DOMI_OPS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.import
    profiles:
      - tools
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-domi_ops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-domi_ops}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - domi_ops_internal

networks:
  domi_ops_internal:
    driver: bridge
  proxy:
    name: domi_ops_proxy
    driver: bridge

volumes:
  domi_ops_pg:
  domi_ops_redis:
  domi_ops_minio:
