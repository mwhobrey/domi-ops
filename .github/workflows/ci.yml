name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".cursor/**"
  # Any base branch, not just main: a stack of dependent PRs has each one based on the one below, and
  # those must be checked too (they were silently skipped before).
  pull_request:

jobs:
  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
            build_args: API_URL=http://api:4000
          - name: import
            dockerfile: Dockerfile.import
          - name: www
            dockerfile: apps/www/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Exercise the same Node/npm versions and workspace COPY layout as publishing.
      # Node 22 CI alone can accept a lockfile that Node 24 images reject.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=ci-${{ matrix.name }},ignore-error=true
          cache-to: type=gha,scope=ci-${{ matrix.name }},mode=max,ignore-error=true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Hosted QA safety guards
        run: node --test scripts/hosted-qa/ownership.test.mjs scripts/hosted-qa/cleanup.test.mjs scripts/hosted-qa/mcp-origin.test.mjs

      - name: MCP client packaging
        run: node --test scripts/mcp-chatgpt/package.test.mjs scripts/mcp-claude/package.test.mjs scripts/mcp-gemini/package.test.mjs scripts/mcp-gemini/registration.test.mjs scripts/mcp-grok-bot/package.test.mjs

  test-mcp:
    name: MCP authorization and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Same isolated PostgreSQL/TLS runner as local acceptance; no hosted secrets,
      # live database, permissive TLS override or seeded production household.
      - name: MCP restricted-role HTTPS acceptance
        shell: pwsh
        run: ./scripts/test-mcp-auth.ps1 -UseSystemNode

  test-hosted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domi_ops
          POSTGRES_PASSWORD: domi_ops
          POSTGRES_DB: domi_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domi_ops -d domi_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-archive:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domi_ops
          POSTGRES_PASSWORD: domi_ops
          POSTGRES_DB: domi_ops
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U domi_ops -d domi_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://domi_ops:domi_ops@localhost:5432/domi_ops

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Migrate database
        run: npm run migrate:run -w @domi-ops/db

      - name: Seed hosted QA households
        run: npm run seed:hosted-qa -w @domi-ops/db

      - name: Create RLS-enforced app role
        run: npm run db:create-app-role

      # Restore requires an empty destination with the same schema and a restricted role.
      # Never seed this database or point the rehearsal at the shared source database.
      - name: Prepare empty archive restore database
        run: |
          npm run migrate:run -w @domi-ops/db
          npm run db:create-app-role
        env:
          DATABASE_URL: postgresql://domi_ops:domi_ops@localhost:5433/domi_ops

      - name: Hosted tenant isolation tests
        run: npm run test:hosted
        env:
          HOSTED_TEST_DATABASE_URL: postgresql://domi_ops_app:domi_ops_app@localhost:5432/domi_ops
          HOSTED_ARCHIVE_RESTORE_TEST_DATABASE_URL: postgresql://domi_ops_app:domi_ops_app@localhost:5433/domi_ops
