name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - ".cursor/**"
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  test-hosted:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domi_ops
          POSTGRES_PASSWORD: domi_ops
          POSTGRES_DB: domi_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domi_ops -d domi_ops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://domi_ops:domi_ops@localhost:5432/domi_ops
      HOSTED_TEST_DATABASE_URL: postgresql://domi_ops:domi_ops@localhost:5432/domi_ops

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Migrate database
        run: npm run migrate:run -w @domi-ops/db

      - name: Seed hosted QA households
        run: npm run seed:hosted-qa -w @domi-ops/db

      - name: Hosted tenant isolation tests
        run: npm run test:hosted
