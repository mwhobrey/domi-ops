# Build and push private GHCR images for pull-only prod deploy (WHO-133).
# Droplet: docker login ghcr.io, then compose pull + up --no-build.
name: Publish images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    # Docs-only pushes don't change images — skip to save Actions minutes.
    paths-ignore:
      - "**/*.md"
      - ".cursor/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mwhobrey
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
            build_args: API_URL=http://api:4000
          - name: import
            dockerfile: Dockerfile.import
          - name: www
            dockerfile: apps/www/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/domi-ops-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # ignore-error: cache API timeouts (results-receiver) should not fail the build
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true
