version: 2
updates:
  # npm workspaces — root manifest covers the whole monorepo (apps/*, packages/*)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Types follow the lowest Node major we run and test (22 in CI and the marketing image; the
      # app images are 24). A newer major's types describe APIs that do not exist there, and CI
      # cannot tell. Patch and minor updates still come through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Capacitor Firebase Authentication 8 requires firebase ^12.6.0.
      # Revisit the major upgrade together with that plugin's peer support.
      - dependency-name: "firebase"
        versions: [">=13.0.0 <14.0.0"]
    groups:
      # Next.js/React ecosystem moves together often enough that separate PRs just churn CI —
      # bundle them, including Next's matching lint configuration.
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @tiptap/* packages share nested types (extension-link's Mark/Node generics come from
      # @tiptap/core) — bumping one alone without the others breaks typecheck (confirmed
      # 2026-08-30, PRs #16/#18). Must move together.
      tiptap:
        patterns:
          - "@tiptap/*"
      # Routine maintenance shares one lockfile and one validation run. Major
      # upgrades stay separate; framework/editor groups above take precedence.
      maintenance:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Application images use Node 24; the marketing image uses Node 22.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
