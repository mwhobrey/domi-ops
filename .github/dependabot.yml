version: 2
updates:
  # npm workspaces — root manifest covers the whole monorepo (apps/*, packages/*)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Next.js/React ecosystem moves together often enough that separate PRs just churn CI —
      # bundle them. Everything else stays one-PR-per-bump so audits stay easy to reason about.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @tiptap/* packages share nested types (extension-link's Mark/Node generics come from
      # @tiptap/core) — bumping one alone without the others breaks typecheck (confirmed
      # 2026-08-30, PRs #16/#18). Must move together.
      tiptap:
        patterns:
          - "@tiptap/*"

  # Dockerfiles (api, web, worker, import) all pin node:22-alpine as their base image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
